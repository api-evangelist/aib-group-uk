name: AIB Group (UK)
kind: company
description: AIB Group (UK) p.l.c. is a UK bank incorporated in Northern Ireland
  (registered number NI018800, registered office 92 Ann Street, Belfast BT1 3HH),
  authorised by the Prudential Regulation Authority and regulated by the Financial
  Conduct Authority and the Prudential Regulation Authority. It trades as Allied
  Irish Bank (GB) and Allied Irish Bank (GB) Savings Direct, and is the UK banking
  subsidiary of the Irish AIB Group plc. As one of the CMA9 banks mandated under
  the UK Competition and Markets Authority's Open Banking order, it runs a public
  developer portal publishing UK Open Banking APIs conformant to the Open Banking
  Implementation Entity (OBIE) standards - a public, unauthenticated Open Data API
  (v2.2) exposing personal current account, business current account, and unsecured
  SME loan product reference data, alongside the FAPI-secured Read/Write family
  (Account and Transaction Information, Payment Initiation, Confirmation of Funds,
  and Variable Recurring Payments to OBIE v4.0) accessed under OAuth2/OIDC consent
  with PSD2 strong customer authentication, dynamic client registration, and a
  sandbox for onboarding and testing before production.
